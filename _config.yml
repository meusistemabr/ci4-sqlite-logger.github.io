title: "CI4 SQLite Logger"
description: "O CI4 SQLite Logger é uma biblioteca de logging de alta integridade para CodeIgniter 4. Diferente dos logs tradicionais em texto, ele armazena eventos em um banco de dados SQLite rotativo, utilizando uma Corrente de Custódia (Hash Chain) para garantir que os registros não sejam alterados ou deletados sem detecção."
url: "https://codeigniter-sqlite-logger.meusistema.com.br/"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag


color_scheme: light

search_enabled: true
search:
  tokenizer_separator: /[\s\-,]+/
  preview_words_before: 5
  preview_words_after: 5

aux_links:
  "Repositório GitHub":
    - "https://github.com"

call_to_action: "Baixar Projeto"
call_to_action_url: "https://github.com/releases"

gh_edit_repository: "https://github.com"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  highlight:
    color: yellow
  important:
    title: IMPORTANTE
    color: blue
  new:
    title: New
    color: green
  note:
    title: NOTAS
    color: purple
  warning:
    title: ATENÇÃO
    color: red

footer_content: "Copyright &copy; 2026 Meu Projeto. Distribuído sob a licença MIT."
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .jekyll-cache/
  - .jekyll-metadata
